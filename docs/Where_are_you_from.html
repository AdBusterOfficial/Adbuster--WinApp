
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where are you from? | AdBuster PRO</title>
</head>
<body style="margin:0; padding:20px; background:#f4f6f8;
             font-family:Arial,sans-serif; text-align:center;">

  <main style="max-width:600px; margin:30px auto;">

    <img
      src="https://i.imgur.com/RajyGcL.jpeg"
      alt="Where are you from?"
      style="display:block; width:100%; height:auto;
             border-radius:12px; margin-bottom:25px;"
    >

    <form
      action="https://formspree.io/f/mayvpzkn"
      method="POST"
      style="box-sizing:border-box; width:100%; padding:25px;
             background:#0a1a2f; border-radius:14px;"
    >

      <label for="country"
        style="display:block; color:#d4af37; font-size:20px;
               font-weight:bold; margin-bottom:15px;">
        Where are you from?
      </label>

      <input
        id="country"
        type="text"
        name="country"
        placeholder="Type your country here"
        autocomplete="country-name"
        required
        style="box-sizing:border-box; display:block; width:100%;
               padding:14px; margin-bottom:18px; font-size:16px;
               border:2px solid #d4af37; border-radius:8px;
               background:#ffffff; color:#0a1a2f;"
      >

      <button
        type="submit"
        style="width:100%; padding:14px; background:#d4af37;
               color:#0a1a2f; border:0; border-radius:8px;
               font-size:16px; font-weight:bold; cursor:pointer;">
        Send
      </button>

    </form>

    <p style="margin-top:25px;">
      <a href="https://github.com/AdBusterOfficial/Adbuster--WinApp"
         style="color:#0a1a2f;">
        ← Back to AdBuster PRO on GitHub
      </a>
    </p>

  </main>
</body>
</html>
